# P3 alert thresholds (FR-5). Config over code — tune without touching code.
oi_spike_pct: 5.0
zone_proximity_pct: "0.5"          # within 0.5% of a fresh OB/FVG edge
fng_low: 20                        # Fear & Greed at/below → extreme fear
fng_high: 80                       # at/above → extreme greed
structure_timeframes: ["1h", "4h"] # which TFs surface a structure event
zone_timeframes: ["15m", "1h"]     # which TFs check price-near-fresh-zone
sweep_timeframes: ["15m", "1h"]    # which TFs contribute equal-level sweeps
max_sweeps: 3
